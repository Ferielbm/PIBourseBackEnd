<div class="p-6 bg-gray-50 dark:bg-gray-950 dark:text-gray-100 min-h-screen">
  
  <!-- Header -->
  <div class="mb-6">
    <h1 class="text-3xl font-bold text-gray-900 dark:text-gray-100 mb-4">
      Ordres Planifiés
    </h1>

    <!-- Tabs -->
    <div class="flex gap-2 border-b border-gray-300 dark:border-gray-700">
      
      <button
        (click)="switchTab('list')"
        [class.active]="activeTab === 'list'"
        class="px-4 py-3 font-semibold text-sm transition"
        [ngClass]="activeTab === 'list'
          ? 'text-purple-400 border-b-2 border-purple-500'
          : 'text-gray-600 hover:text-gray-900 dark:text-gray-300 dark:hover:text-white'">
        📋 Liste des Ordres
      </button>

      <button
        (click)="switchTab('form')"
        [class.active]="activeTab === 'form'"
        class="px-4 py-3 font-semibold text-sm transition"
        [ngClass]="activeTab === 'form'
          ? 'text-purple-400 border-b-2 border-purple-500'
          : 'text-gray-600 hover:text-gray-900 dark:text-gray-300 dark:hover:text-white'">
        ➕ Créer un Ordre
      </button>

    </div>
  </div>

  <!-- Content -->
  <div class="bg-white dark:bg-gray-900 rounded-lg shadow dark:shadow-none">

    <!-- List Tab -->
    <div *ngIf="activeTab === 'list'">
      <app-scheduled-orders-list [playerId]="playerId"></app-scheduled-orders-list>
    </div>

    <!-- Form Tab -->
    <div *ngIf="activeTab === 'form'" class="p-6">
      <app-scheduled-order-form [playerId]="playerId"></app-scheduled-order-form>
    </div>

  </div>
</div>
